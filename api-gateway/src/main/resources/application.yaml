server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # Account Service
            - id: account-service
              uri: lb://ACCOUNT-SERVICE
              predicates:
                - Path=/account-service/**
              filters:
                - StripPrefix=1

            # Customer Service
            - id: customer-service
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customer-service/**
              filters:
                - StripPrefix=1

            # Transaction Service
            - id: transaction-service
              uri: lb://TRANSACTION-SERVICE
              predicates:
                - Path=/transaction-service/**
              filters:
                - StripPrefix=1


            # Auth Service
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoint:
    gateway:
      enabled: true
      access: read-only


  endpoints:
    web:
      exposure:
        include: "*"